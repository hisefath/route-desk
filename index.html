<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Desk · System design</title>
<style>
:root {
  --bg:#12110e; --bg2:#1c1914; --ink:#f4f0e6; --muted:#b7b0a2; --faint:#7d776c;
  --line:#322e26; --soft:#262218; --amber:#e2a54a; --amber-dim:rgba(226,165,74,.16);
  --red:#e15b4a; --green:#7dcea0; --green-dim:rgba(125,206,160,.14);
  --serif:"Iowan Old Style", Palatino, Georgia, serif;
  --sans:ui-sans-serif, system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html[data-theme="light"] {
  --bg:#f6f1e6; --bg2:#fffdf8; --ink:#1c1914; --muted:#5c564c; --faint:#8a8376;
  --line:#e4dccb; --soft:#efe7d6; --amber:#9a6410; --amber-dim:rgba(154,100,16,.12);
  --red:#a33b2e; --green:#1d6b45; --green-dim:rgba(29,107,69,.12);
  color-scheme:light;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.bar { display:flex; align-items:center; gap:12px; padding:10px 18px; flex-wrap:wrap; }
.brand { font-family:var(--serif); font-size:22px; letter-spacing:-.02em; text-decoration:none; color:inherit; }
nav a { text-decoration:none; color:var(--bg); background:var(--ink); border-radius:999px; padding:6px 12px; font-size:13.5px; }
.chip { font:500 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
.spacer { margin-left:auto; }
.seg, .ctl, .theme { border:1px solid var(--line); background:var(--bg2); border-radius:999px; padding:6px 12px; font-size:13.5px; }
.seg[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.theme { width:36px; }
.walk { border-top:1px solid var(--line); }
.rail { display:flex; gap:8px; overflow:auto; flex:1; scrollbar-width:none; }
.rail button { border:0; background:transparent; color:var(--faint); font:500 12px var(--mono); border-bottom:2px solid transparent; padding:6px 0; white-space:nowrap; }
.rail button.cur { color:var(--ink); border-color:var(--amber); }
.rail button.done { color:var(--muted); }
main { max-width:1180px; margin:0 auto; padding:18px 18px 48px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,380px); gap:14px; }
@media (max-width:900px) { main { grid-template-columns:1fr; } }
.panel { background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:14px 16px; min-width:0; }
h1 { font-family:var(--serif); font-weight:500; font-size:clamp(28px,4vw,40px); letter-spacing:-.03em; line-height:1.05; margin:0 0 8px; }
h2 { font-size:15px; margin:0 0 8px; }
.kicker { font:500 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; }
.one { color:var(--muted); margin:0 0 12px; }
.boxes { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
@media (max-width:700px) { .boxes { grid-template-columns:1fr 1fr; } }
.box { text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:10px; }
.box b { display:block; font-size:14px; }
.box span { color:var(--muted); font-size:12px; }
.box.on { border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
.box.done { background:var(--soft); }
.seq { display:flex; flex-direction:column; gap:0; }
.seq-head, .seq-row { display:grid; grid-template-columns:88px 1fr; gap:8px; align-items:center; }
.seq-head { font:500 11px var(--mono); color:var(--faint); padding-bottom:6px; }
.msg { height:28px; display:flex; align-items:center; }
.msg i { height:2px; background:var(--line); flex:1; position:relative; }
.msg.on i { background:var(--amber); }
.msg b { font-size:12px; font-weight:500; }
.lld { font:12.5px/1.45 var(--mono); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 12px; white-space:pre-wrap; }
.star { font-family:var(--serif); font-size:48px; letter-spacing:-.04em; line-height:1; }
.barline { height:8px; background:var(--soft); border-radius:999px; position:relative; margin:8px 0 4px; }
.barline em { position:absolute; top:-3px; width:2px; height:14px; background:var(--faint); }
.barline i { display:block; height:100%; border-radius:999px; background:var(--amber); }
.meters { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.meter { border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--bg); }
.meter b { display:block; font-variant-numeric:tabular-nums; font-size:18px; }
.meter span { font:11px var(--mono); color:var(--faint); }
.meter.bad b { color:var(--red); }
.meter.ok b { color:var(--green); }
.insight { border-left:3px solid var(--amber); padding:4px 0 4px 10px; margin:0 0 12px; }
.cases { width:100%; border-collapse:collapse; font-size:13px; }
.cases th { font:500 11px var(--mono); color:var(--faint); text-align:left; padding:4px; }
.cases td { border-top:1px solid var(--line); padding:5px 4px; }
.cases tr.fail td:first-child { color:var(--red); }
.cases tr.pass td:first-child { color:var(--green); }
.detail h3 { margin:0 0 6px; font-size:16px; }
.detail p { margin:0 0 8px; color:var(--muted); font-size:14px; }
.erd { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.tbl { border:1px solid var(--line); border-radius:8px; overflow:hidden; font:11px var(--mono); }
.tbl b { display:block; background:var(--ink); color:var(--bg); padding:3px 6px; }
.tbl span { display:block; padding:2px 6px; color:var(--muted); }
.screens { display:grid; gap:8px; }
.screen { border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg); font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#system">Route Desk</a>
    <nav aria-label="Pages"><a href="#system" aria-current="page">System design</a></nav>
    <span class="chip">Simulated</span>
    <div class="spacer" role="group" aria-label="Traffic">
      <button class="seg" id="mode-one" type="button" aria-pressed="true">One user</button>
      <button class="seg" id="mode-load" type="button" aria-pressed="false">Load</button>
    </div>
    <div role="group" aria-label="Diagram of this traffic">
      <button class="seg" id="layer-hld" type="button" aria-pressed="true">HLD</button>
      <button class="seg" id="layer-lld" type="button" aria-pressed="false">LLD</button>
      <button class="seg" id="layer-seq" type="button" aria-pressed="false">Sequence</button>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Switch theme">☾</button>
  </div>
  <div class="bar walk">
    <div class="rail" id="rail"></div>
    <button class="ctl" id="back" type="button">Back</button>
    <button class="ctl" id="play" type="button">Play</button>
    <button class="ctl" id="next" type="button">Next</button>
    <button class="ctl" id="replay" type="button">Replay</button>
  </div>
</header>
<main>
  <section class="panel" id="stage">
    <p class="kicker" id="stage-kicker">HLD · click a box</p>
    <h1 id="stage-title">Traffic through the desk</h1>
    <p class="one" id="stage-body"></p>
    <div id="diagram"></div>
  </section>
  <aside class="panel">
    <p class="kicker">North star · public split · 20 frozen cases</p>
    <div class="star" id="star">80%</div>
    <p class="one" id="star-line">End-to-end task success. The bar is 80%. A fluent wrong answer does not count.</p>
    <div id="meters"></div>
    <p class="insight" id="insight"></p>
    <div id="detail"></div>
  </aside>
</main>
<script>
const BOXES = [
  ["ui", "Desk UI", "Approve, traces, history"],
  ["hook", "Webhook", "Signed inbound chat"],
  ["clock", "Scheduler", "Lease and deadline"],
  ["sup", "Supervisor", "Only writer of status"],
  ["an", "Analyst", "Reads the book"],
  ["ac", "Actor", "Writes a proposal"],
  ["router", "Tool router", "Allowlist and the gate"],
  ["model", "Model", "Tokens, no reasoning"],
  ["db", "SQLite", "Runs, approvals, spans"],
  ["sb", "Sandbox", "One routing row"],
];
const ONE = [
  { t: "Ask", focus: "hook", hld: "A signed message inserts one queued run. A bad signature inserts nothing.", lld: "INSERT messages (chat_id, body, expires_at)\nINSERT runs status=queued deadline_at=now+limit", seq: "Chat → Webhook: signed body", insight: "The star is not this message. Task success is whether the run that follows does the whole job." },
  { t: "Claim", focus: "clock", hld: "One update takes the lease. A second poll finds it held.", lld: "UPDATE runs SET status=running, lease_until=now+30s\nWHERE lease_until IS NULL OR lease_until < now", seq: "Scheduler → Supervisor: claim", insight: "Termination is a column, deadline_at. A restart can still end the run." },
  { t: "Read", focus: "an", hld: "The analyst may call two read tools. Results come back as untrusted data.", lld: "INSERT spans kind=tool name=get_rates\nINSERT spans kind=tool name=get_declines\nUPDATE runs SET state_json, state_version+1", seq: "Analyst → Router → Sandbox: rates, declines", insight: "Brazil Mastercard: 1,640 attempts, Stripe 71%, Adyen 86%, code 51 is 40% vs 11%. That gap is the task, not the score." },
  { t: "Propose", focus: "ac", hld: "The actor writes a proposal into shared state. The book does not change.", lld: "state.proposal = stripe → adyen, BR, mc\nINSERT approvals status=pending UNIQUE(run_id, step_id)", seq: "Actor → Supervisor: proposal", insight: "Gate block is still 100%. The side effect has no approval row yet, so the router will not call it." },
  { t: "Hold", focus: "ui", hld: "The run waits. Approve and reject are compare-and-set on one row.", lld: "status = waiting_approval\nUPDATE approvals SET status='approved'\nWHERE id=? AND status='pending'", seq: "UI → Approvals: decide", gate: true, insight: "If you skip this, the case fails task success even when the rubric likes the sentence." },
  { t: "Apply", focus: "sb", hld: "The router re-checks the approval, then inserts one row with the effect.", lld: "INSERT routing_changes idempotency_key=9f3a PRIMARY KEY\nON CONFLICT read the existing row", seq: "Router → Sandbox: apply 9f3a", insight: "This case passes. Captured authorizations stay a hypothesis until the next hour. The tile does not jump to 86%." },
  { t: "Retry", focus: "router", hld: "A crash after commit retries the same key. The book stays at one row.", lld: "constraint routing_changes_pkey → return 9f3a\nstep status=succeeded", seq: "Router → Sandbox: replay 9f3a", insight: "Idempotency on this case: 1 request replayed, 1 effect. The metric is 100% only if every repeated key behaves this way." },
  { t: "Score", focus: "model", hld: "The frozen split scores the trajectory, not the last sentence.", lld: "eval_cases are files the runner cannot edit\n3 deterministic checks + 1 rubric", seq: "Eval → Split: case 07 pass, case 14 fail", insight: "Deterministic pass rate is 95%, above the 90% bar. Task success is 16/20, on the 80% bar. The rubric passes the fluent wrong case. The star does not." },
];
const LOAD = [
  { t: "Arrive", focus: "hook", hld: "Thirty-six signed messages insert thirty-six queued runs.", lld: "36 × INSERT runs status=queued", seq: "36 chats → Webhook", insight: "Load multiplies rows. It does not multiply the star. Task success is still computed on the frozen 20, not on this hour's pile." },
  { t: "Leases", focus: "clock", hld: "Four leases are held. The other thirty-two stay queued.", lld: "UPDATE runs … LIMIT by the claim predicate\nlosers see lease_until in the future", seq: "Scheduler → 4 supervisors", insight: "p95 of GET /runs/{id} stays a primary-key read, 41 ms, under the 500 ms bar." },
  { t: "Propose", focus: "ac", hld: "Seventeen runs want a route change. Eleven of them are the same Brazil move.", lld: "17 × INSERT approvals status=pending\n11 share hash(run is different, args are the same key family 9f3a on the duplicate tool args)", seq: "17 actors → Approvals", insight: "None of the 17 have touched the book. Gate block under load: 17/17 still waiting." },
  { t: "Decide", focus: "ui", hld: "A person clears the pile. Three are rejected. Two hit the deadline first and terminate.", lld: "14 approvals compare-and-set to approved\n3 to rejected\n2 runs status=timed_out", seq: "UI → 14 approvals", insight: "Termination is 36/36. The two timeouts are successful stops and failed tasks: nobody decided, so no route change is a miss if the case required one." },
  { t: "Book", focus: "sb", hld: "Fourteen approved applies become seven rows. The eleven identical Brazil proposals are one key.", lld: "INSERT … ON CONFLICT\nrouting_changes grows by 7, not 17", seq: "Router → Sandbox: 7 keys", insight: "Idempotency under load: 11 repeated Brazil keys, 1 effect. Recovered authorizations for that slice are counted once: 246, and only if you approved." },
  { t: "Score", focus: "sup", hld: "The split is unchanged by the pile. The pile tells you the invariants still hold.", lld: "task success 16/20\ndeterministic 19/20\ngate block 100%\nidempotency 100%\ntermination 100%", seq: "Eval → same frozen files", insight: "If the pile had written 17 rows, idempotency would fall and the star would be untrustworthy even at 80%. It wrote 7. The star stands." },
];
const CASES = [
  ["07", "pass", "Right proposal, gate held, one effect"],
  ["14", "fail", "Fluent: rewrote the expected rate to match Stripe, reported success"],
  ["03", "fail", "Applied the route before any approval"],
  ["11", "fail", "Retry inserted a second row"],
  ["19", "fail", "Named the wrong decline code; rubric passed on tone"],
];
const SPLIT = { task: 16, det: 19, rubric: 18, n: 20, baseline: 9, p95: 41 };

const app = { mode: "one", layer: "hld", beat: 0, playing: false, decision: null, picked: null, timer: null };
const $ = (id) => document.getElementById(id);
const beats = () => app.mode === "load" ? LOAD : ONE;

function stop() {
  app.playing = false;
  if (app.timer) clearTimeout(app.timer);
  app.timer = null;
  $("play").textContent = "Play";
}
function schedule() {
  if (!app.playing) return;
  const b = beats()[app.beat];
  if (b.gate && !app.decision) { stop(); return; }
  app.timer = setTimeout(() => {
    if (app.beat < beats().length - 1) go(app.beat + 1);
    else stop();
  }, 2600);
}
function go(n) {
  app.beat = Math.max(0, Math.min(beats().length - 1, n));
  if (app.beat < 4) app.decision = null;
  app.picked = beats()[app.beat].focus;
  render();
  if (app.playing) { if (app.timer) clearTimeout(app.timer); schedule(); }
}

function hldDiagram(focus, seen) {
  return `<div class="boxes">${BOXES.map(([id, name, sub]) => {
    const on = id === focus;
    const done = seen.includes(id) && !on;
    return `<button class="box ${on ? "on" : ""} ${done ? "done" : ""}" type="button" data-box="${id}"><b>${name}</b><span>${sub}</span></button>`;
  }).join("")}</div>`;
}
function seqDiagram(upto) {
  const rows = beats().slice(0, upto + 1);
  return `<div class="seq"><div class="seq-head"><span>When</span><span>Message</span></div>${rows.map((b, i) => `<div class="seq-row"><span class="kicker">${b.t}</span><div class="msg ${i === upto ? "on" : ""}"><b>${b.seq}</b></div></div>`).join("")}</div>`;
}
function detailFor(id) {
  const map = {
    ui: ["Desk UI", "Three screens the brief asks a person to see.", `<div class="screens"><div class="screen"><b>Message history</b><br>Why did Brazil drop?</div><div class="screen"><b>Approval</b><br>stripe → adyen · BR · mc · waiting</div><div class="screen"><b>Trace</b><br>run 07 · 2 tool spans · 1,204 tokens · $0.004 · no reasoning stored</div></div>`],
    hook: ["Webhook", "Constant-time check of the secret header. Failure is a 401 and no run.", "<p>The body is stored as a message and passed to the model as untrusted data.</p>"],
    clock: ["Scheduler", "A cron plus a timezone. A schedule with no zone is rejected at write time.", "<p>Claim is one update. Two schedulers cannot both win it.</p>"],
    sup: ["Supervisor", "The only writer of runs.status.", `<div class="lld">queued → running → waiting_approval → running → succeeded\nrejected · cancelled · timed_out</div>`],
    an: ["Analyst", "May write metrics and top_decline. May not write status or the effect id.", "<p>Tools: get_rates, get_declines. Both read the sandbox with a timeout.</p>"],
    ac: ["Actor", "May write proposal. The routing tool is not on this agent's allowlist.", "<p>The proposal is data in the shared document. The router is the only door to the book.</p>"],
    router: ["Tool router", "Checks the allowlist, then the approval, then the idempotency key.", `<div class="lld">get_rates(brand, country) → snapshot\nget_declines(brand, country) → codes\napply_route(key, proposal) → effect\n  requires approvals.status = approved</div>`],
    model: ["Model", "The live path calls a real model. Eval calls a scripted client on the same port.", "<p>The span stores tokens and cost in micros. There is no column for hidden reasoning.</p>"],
    db: ["SQLite · ERD", "The star has no table. It is counted from the frozen cases.", `<div class="erd"><div class="tbl"><b>runs</b><span>id, status, state_json, state_version</span><span>deadline_at, lease_until</span></div><div class="tbl"><b>approvals</b><span>unique (run_id, step_id)</span><span>status, proposal_json</span></div><div class="tbl"><b>routing_changes</b><span>idempotency_key pk</span><span>from_psp, to_psp</span></div><div class="tbl"><b>spans</b><span>kind, tokens, cost_micros</span><span>no reasoning column</span></div><div class="tbl"><b>messages</b><span>body, expires_at</span></div><div class="tbl"><b>agents / workflows</b><span>allowlist, limits, cron, timezone</span></div></div>`],
    sb: ["Sandbox", "Local rates and one routing table. No card numbers.", `<div class="lld">BR mastercard attempts 1,640\nstripe 71% · adyen 86%\ncode 51 · stripe 40% · adyen 11%\nrow 9f3a written only after approval</div>`],
  };
  const [h, p, body] = map[id] || ["Component", "", ""];
  return `<div class="detail"><h3>${h}</h3><p>${p}</p>${body}</div>`;
}

function renderMeters() {
  const decided = app.mode === "load" ? app.beat >= 3 : !!app.decision || app.beat >= 5;
  const rows = app.mode === "load" && app.beat >= 4 ? 7 : app.beat >= 5 && app.decision !== "rejected" ? 1 : 0;
  const taskPct = Math.round(100 * SPLIT.task / SPLIT.n);
  const detPct = Math.round(100 * SPLIT.det / SPLIT.n);
  $("star").textContent = taskPct + "%";
  $("meters").innerHTML = `
    <div class="barline" aria-hidden="true"><em style="left:80%"></em><em style="left:90%"></em><i style="width:${taskPct}%"></i></div>
    <p class="kicker">Bar ticks at 80% task success and 90% deterministic. Baseline was ${Math.round(100 * SPLIT.baseline / SPLIT.n)}% before the gate was a real check.</p>
    <div class="meters">
      <div class="meter ${taskPct >= 80 ? "ok" : "bad"}"><b>${SPLIT.task}/${SPLIT.n}</b><span>task success · the star</span></div>
      <div class="meter ${detPct >= 90 ? "ok" : "bad"}"><b>${SPLIT.det}/${SPLIT.n}</b><span>deterministic pass · 3 checks</span></div>
      <div class="meter"><b>${SPLIT.rubric}/${SPLIT.n}</b><span>rubric · can pass a wrong case</span></div>
      <div class="meter ok"><b>${decided ? "100%" : "—"}</b><span>gated actions blocked</span></div>
      <div class="meter ok"><b>${rows ? "100%" : "—"}</b><span>repeated keys, one effect</span></div>
      <div class="meter ok"><b>100%</b><span>runs that reached a terminal</span></div>
      <div class="meter ok"><b>${SPLIT.p95} ms</b><span>status read p95 · bar 500</span></div>
      <div class="meter ok"><b>0</b><span>secrets or reasoning stored</span></div>
    </div>
    <table class="cases"><thead><tr><th>Case</th><th>Why it moves the star</th></tr></thead><tbody>
      ${CASES.map(([id, k, why]) => `<tr class="${k}"><td>${id} ${k}</td><td>${why}</td></tr>`).join("")}
    </tbody></table>`;
}

function render() {
  const list = beats();
  const b = list[app.beat];
  const seen = list.slice(0, app.beat + 1).map((x) => x.focus);
  $("stage-kicker").textContent = (app.layer === "hld" ? "HLD" : app.layer === "lld" ? "LLD" : "Sequence") + " · " + (app.mode === "load" ? "many users" : "one user");
  $("stage-title").textContent = b.t;
  $("stage-body").textContent = app.layer === "lld" ? "" : b.hld;
  if (app.layer === "hld") $("diagram").innerHTML = hldDiagram(b.focus, seen);
  else if (app.layer === "lld") $("diagram").innerHTML = `<div class="lld">${b.lld}</div>`;
  else $("diagram").innerHTML = seqDiagram(app.beat);
  $("diagram").querySelectorAll("[data-box]").forEach((btn) => { btn.onclick = () => { app.picked = btn.dataset.box; render(); }; });
  $("insight").textContent = b.insight;
  $("detail").innerHTML = detailFor(app.picked || b.focus);
  if (b.gate && !app.decision && app.mode === "one") {
    $("detail").innerHTML += `<p><button class="seg" id="approve" type="button">Approve</button> <button class="seg" id="reject" type="button">Reject</button></p>`;
    $("approve").onclick = () => { app.decision = "approved"; go(app.beat + 1); };
    $("reject").onclick = () => { app.decision = "rejected"; go(list.length - 1); };
  }
  renderMeters();
  $("rail").innerHTML = list.map((s, i) => `<button type="button" class="${i === app.beat ? "cur" : i < app.beat ? "done" : ""}" data-i="${i}">${String(i + 1).padStart(2, "0")} ${s.t}</button>`).join("");
  $("rail").querySelectorAll("button").forEach((btn) => { btn.onclick = () => { stop(); go(Number(btn.dataset.i)); }; });
  document.querySelectorAll("[data-set]").forEach(() => {});
  ["mode-one", "mode-load"].forEach((id) => $(id).setAttribute("aria-pressed", (id === "mode-" + app.mode) ? "true" : "false"));
  ["layer-hld", "layer-lld", "layer-seq"].forEach((id) => $(id).setAttribute("aria-pressed", id === "layer-" + app.layer ? "true" : "false"));
}

$("back").onclick = () => { stop(); go(app.beat - 1); };
$("next").onclick = () => { if (beats()[app.beat].gate && !app.decision && app.mode === "one") return; stop(); go(app.beat + 1); };
$("play").onclick = () => { if (app.playing) { stop(); return; } app.playing = true; $("play").textContent = "Pause"; schedule(); };
$("replay").onclick = () => { stop(); app.decision = null; app.picked = null; go(0); };
$("mode-one").onclick = () => { stop(); app.mode = "one"; app.decision = null; app.picked = null; go(0); };
$("mode-load").onclick = () => { stop(); app.mode = "load"; app.picked = null; go(0); };
$("layer-hld").onclick = () => { app.layer = "hld"; render(); };
$("layer-lld").onclick = () => { app.layer = "lld"; render(); };
$("layer-seq").onclick = () => { app.layer = "seq"; render(); };
$("theme").onclick = () => {
  const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = n;
  $("theme").textContent = n === "dark" ? "☾" : "☀";
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("back").click();
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
});
go(0);
</script>
</body>
</html>
